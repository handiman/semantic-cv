name: CI/CD
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
# One run per branch at a time. On master the runs queue instead of overlapping, and a newer
# queued run replaces an older one that has not started: `version` works out the next number from
# the tags, so two overlapping runs both picked the same one and the second failed on npm publish
# ("Cannot publish over previously staged version"), leaving its commits out of the release. A run
# that is already going is never cancelled on master: the publish and the tag must finish together.
# Other branches cancel a superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Read-only by default; only the release job gets write access.
permissions:
  contents: read
jobs:
  # package.json promises Node >= 20, so every supported major is exercised. `node --test` only
  # expands globs from Node 21, so the test scripts can't run on 20: there the CLI is built and
  # smoke-tested instead. Coverage and the release stay on 25.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 25]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - run: node -v

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      # The submodules' tests need their own devDependencies (jsdom, fast-check).
      - name: Install
        run: |
          npm ci
          npm --prefix src/core ci
          npm --prefix src/themes ci

      - name: Run tests
        if: matrix.node != 20
        run: |
          npm install -g xunit-viewer
          npm run test

      - name: Smoke test
        if: matrix.node == 20
        run: |
          npm run build
          mkdir smoke && cp sample.cv.json smoke/cv.json && cd smoke
          node ../bin/cli --version
          node ../bin/cli analyze
          node ../bin/cli normalize
          node ../bin/cli render minimal
          test -s cv.json.html && test -s cv.json.txt

      - name: Lint
        run: npm run lint

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.node != 20
        with:
          name: test-results-node-${{ matrix.node }}
          path: test-results.*

  # A separate job, so that the coverage limit is a check of its own that can be made required in
  # the branch protection (or taken out of it) without touching the tests. The limits sit a few points
  # below the current figures; raise them when the coverage has gone up, don't lower them to get a PR
  # through. The coverage is measured for the CLI, core and themes tests together.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 25
      - run: node -v

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build
        run: |
          npm ci
          npm --prefix src/core ci
          npm --prefix src/themes ci
          npm run build

      - name: Code coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/

      - name: Check the coverage limits
        run: npx c8 check-coverage --lines 95 --functions 93 --branches 87

  version:
    runs-on: ubuntu-latest
    outputs:
      bump_type: ${{ steps.bump.outputs.type }}
      next_version: ${{ steps.final.outputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 25
      - run: node -v

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all tags explicitly
        run: |
          git fetch --tags --force
          git tag -l

      - name: Get last tag
        id: lasttag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Read package.json version
        id: pkg
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Determine bump type
        id: bump
        env:
          LAST: ${{ steps.lasttag.outputs.tag }}
        run: |
          if [ -z "$LAST" ]; then LAST="v0.0.0"; fi

          COMMITS=$(git log "$LAST"..HEAD --pretty=%s)

          echo "Commits since last tag:"
          echo "$COMMITS"

          if echo "$COMMITS" | grep -qiE "BREAKING[ -]CHANGE:" || echo "$COMMITS" | grep -qE "^[a-zA-Z]+(\(.+\))?!:"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE '^fix(\(.+\))?:'; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=none" >> $GITHUB_OUTPUT
          fi

      - name: Calculate automatic version bump
        id: auto
        env:
          LAST: ${{ steps.lasttag.outputs.tag }}
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          if [ -z "$LAST" ]; then
            LAST="v0.0.0"
          fi

          VERSION=${LAST#v}
          IFS='.' read -r MA MI PA <<< "$VERSION"

          case "$BUMP_TYPE" in
            major) MA=$((MA+1)); MI=0; PA=0;;
            minor) MI=$((MI+1)); PA=0;;
            patch) PA=$((PA+1));;
            none)
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              exit 0;;
          esac

          AUTO="$MA.$MI.$PA"
          echo "version=$AUTO" >> $GITHUB_OUTPUT

      - name: Determine final version # (manual override wins)
        id: final
        env:
          PKG: ${{ steps.pkg.outputs.version }}
          AUTO: ${{ steps.auto.outputs.version }}
          LAST: ${{ steps.lasttag.outputs.tag }}
        run: |
          npm install semver
          if [ -z "$LAST" ]; then LAST="v0.0.0"; fi
          LAST_VERSION=${LAST#v}

          DECISION=$(node <<EOF
            const semver = require('semver');
            const pkg = "$PKG";
            const auto = "$AUTO";
            const last = "$LAST_VERSION";

            if (semver.gt(pkg, last)) {
              console.log(pkg); // manual override
            } else {
              console.log(auto); // auto bump
            }
          EOF
          )
          echo "version=$DECISION" >> $GITHUB_OUTPUT
          echo "Next version will be: $DECISION"

  
  changelog:
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Generate changelog
        env:
          VERSION: ${{ needs.version.outputs.next_version }}
        run: node scripts/generate-changelog.js "$VERSION"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog-v${{ needs.version.outputs.next_version }}
          path: CHANGELOG.md          

  release:
    needs: [test, version, changelog]
    runs-on: ubuntu-latest
    if: needs.version.outputs.bump_type != 'none' && github.ref_name == 'master'
    permissions:
      contents: write # push the tag and create the GitHub release
      id-token: write # npm provenance
    env:
      NEXT_VERSION: ${{ needs.version.outputs.next_version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 25
          registry-url: "https://registry.npmjs.org"
      - run: node -v

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the tag push below uses these credentials
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Get last tag
        id: lasttag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Update package.json version
        if: needs.version.outputs.bump_type != 'none'
        run: npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version

      - name: Download changelog artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog-v${{ needs.version.outputs.next_version }}
          path: ./tmp-changelog

      - name: Copy changelog
        run: |
          mkdir -p assets
          cp ./tmp-changelog/CHANGELOG.md ./CHANGELOG.md

      - name: Build + pack
        run: |
          npm ci
          npm run pack

      - name: Publish package to npm
        run: npm publish *.tgz --provenance --access public

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v$NEXT_VERSION"
          git push origin "v$NEXT_VERSION"

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: "v${{ needs.version.outputs.next_version }}"
          artifacts: "*.tgz"
          bodyFile: "CHANGELOG.md"
