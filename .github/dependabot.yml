# Dependabot version updates (security alerts work without this file; this adds
# scheduled PRs that keep dependencies current so alerts have less to catch).
# See https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # typescript-eslint doesn't support TypeScript 7 (peer range <6.1.0), so `npm ci` fails and
      # the linter refuses to start. Remove once it supports TS 7.1+; tracked in
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      # One PR for all routine bumps instead of one per package.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Security fixes grouped the same way, kept apart from routine bumps.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # Bumps the submodules (src/core, src/themes) to their latest master commit, so fixes there
  # reach this repo without a hand-made bump PR.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  # Pinned to commit SHAs with the release as a trailing comment
  # (actions/checkout@<sha> # v6.1.0), so a moved or hijacked tag can't change
  # what runs; this bumps the SHA and the comment for every new release, as one
  # grouped PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
